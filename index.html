<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://firestore.googleapis.com; object-src 'none'; manifest-src 'self'; worker-src 'self'; frame-src blob:; media-src blob:; base-uri 'none'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#2B2380"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Attendance"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="icons/favicon.png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<title>Attendance Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --ink:#1F1B3A;
    --paper:#F7F3EA;
    --surface:#FFFFFF;
    --line:#E3DCCB;
    --muted:#6B6680;
    --primary:#4338A8;
    --primary-dark:#2B2380;
    --primary-tint:#E9E7F8;
    --gold:#E0A030;
    --success:#2F6F4E;
    --success-tint:#E4EFE8;
    --warning:#B8860B;
    --warning-tint:#F7EDD6;
    --danger:#A33636;
    --danger-tint:#F5E1DF;
    --radius:12px;
    --font-serif:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-sans:'DM Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-sans); line-height:1.4;}
  h1,h2,h3{font-family:var(--font-serif); margin:0;}
  button, input, select{font-family:var(--font-sans);}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  .view{display:none;}
  .view.active{display:block;}
  .login-wrap{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr;}
  @media (max-width:860px){ .login-wrap{grid-template-columns:1fr;} }
  .login-hero{background:var(--ink); color:var(--paper); padding:64px 56px; display:flex; flex-direction:column; justify-content:center; gap:22px;}
  .ledger-mark{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .ledger-row{display:flex; align-items:center; gap:12px;}
  .ledger-dot{width:13px; height:13px; border-radius:50%; border:2px solid #7A74B8; flex-shrink:0;}
  .ledger-dot.done{background:var(--gold); border-color:var(--gold);}
  .ledger-line{height:2px; background:rgba(255,255,255,0.16); flex:1;}
  .ledger-line.short{width:55%; flex:none;}
  .login-hero .eyebrow{color:var(--gold); font-weight:600; font-size:0.85rem; letter-spacing:0.02em;}
  .login-hero h1{font-size:clamp(2.1rem,4vw,3.2rem); line-height:1.12; font-weight:600; max-width:11ch; color:#EFEDFB;}
  .login-hero p{color:#CFE3E6; max-width:42ch; line-height:1.65; font-size:1rem;}
  .login-form-wrap{display:flex; align-items:center; justify-content:center; padding:48px 24px; background:var(--paper);}
  .login-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px;}
  .role-tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .role-tab{flex:1; padding:10px 4px; text-align:center; cursor:pointer; font-weight:600; font-size:0.9rem; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent;}
  .role-tab.active{color:var(--primary); border-color:var(--primary);}
  .login-panel .field:last-of-type{margin-bottom:18px;}
  .otp-input{letter-spacing:.45em; text-align:center; font-size:1.25rem; font-weight:600;}
  .hint{font-size:0.78rem; color:var(--muted); margin-top:16px; text-align:center; line-height:1.5;}
  .field-error{font-size:0.8rem; color:var(--danger); background:var(--danger-tint); border:1px solid var(--danger); border-radius:var(--radius); padding:8px 10px; margin:-4px 0 14px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.82rem; color:var(--muted); margin-bottom:6px;}
  input, select{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.92rem; background:var(--surface); color:var(--ink);}
  select[multiple]{padding:6px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:6px;}
  .form-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
  .form-row .field{flex:1; min-width:170px; margin-bottom:0;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:var(--radius); border:1px solid transparent; font-weight:600; font-size:0.88rem; cursor:pointer; transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:0.78rem;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .file-btn{cursor:pointer;}
  .topbar{display:none; align-items:center; justify-content:space-between; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  .topbar .brand{font-family:var(--font-serif); font-weight:600; font-size:1.15rem; color:#000;}
  .who-wrap{display:flex; align-items:center; gap:14px;}
  .who{font-size:0.85rem; color:var(--muted);}
  .app-shell{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 58px); align-items:start;}
  @media (max-width:760px){ .app-shell{grid-template-columns:1fr;} .sidebar{display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);} }
  .sidebar{background:var(--surface); border-right:1px solid var(--line); padding:20px 12px; position:sticky; top:58px;}
  .side-title{font-weight:600; padding:6px 12px; font-size:0.95rem;}
  .side-sub{color:var(--muted); font-size:0.76rem; padding:0 12px 14px;}
  .sidebar-link{display:block; width:100%; text-align:left; padding:10px 12px; border-radius:var(--radius); color:var(--muted); font-weight:500; font-size:0.88rem; background:none; border:none; cursor:pointer; margin-bottom:2px; white-space:nowrap;}
  .side-group{font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); padding:14px 12px 6px; border-top:1px solid var(--line); margin-top:10px;}
  .sidebar-link.active{background:var(--primary-tint); color:var(--primary-dark); font-weight:600;}
  .sidebar-link:hover{background:var(--paper);}
  .main{padding:28px; max-width:1180px; margin:0 auto; width:100%;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:14px; flex-wrap:wrap;}
  .page-head h1{font-size:1.7rem;}
  .sub{color:var(--muted); font-size:0.88rem; margin-top:4px;}
  .notice{padding:12px 16px; border-radius:var(--radius); margin-bottom:18px; font-size:0.88rem;}
  .notice-warning{background:var(--warning-tint); color:#7a5b06; border:1px solid var(--warning);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .card h3{font-size:1.05rem; margin-bottom:14px;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .stat-card .num{font-family:var(--font-serif); font-size:1.7rem; font-weight:600;}
  .stat-card .label{font-size:0.78rem; color:var(--muted); margin-top:2px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){ .grid-2{grid-template-columns:1fr;} }
  table.table{width:100%; border-collapse:collapse; font-size:0.88rem;}
  .table th{text-align:left; padding:10px 12px; border-bottom:2px solid var(--ink); font-weight:600; font-size:0.76rem; color:var(--muted); text-transform:none;}
  .table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .table tr:hover td{background:var(--paper);}
  .empty{text-align:center; color:var(--muted); padding:26px !important;}
  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:100px; font-size:0.75rem; font-weight:600;}
  .badge-success{background:var(--success-tint); color:var(--success);}
  .badge-warning{background:var(--warning-tint); color:var(--warning);}
  .badge-danger{background:var(--danger-tint); color:var(--danger);}
  .bar-track{background:var(--line); height:8px; border-radius:4px; overflow:hidden; width:100%; min-width:60px;}
  .bar-fill{height:100%; border-radius:4px;}
  .pct-cell{display:flex; flex-direction:column; gap:4px; min-width:90px;}
  .pct-cell span{font-size:0.82rem; font-weight:600;}
  .bar-list{display:flex; flex-direction:column; gap:11px;}
  .bar-row{display:grid; grid-template-columns:150px 1fr 46px; align-items:center; gap:10px; font-size:0.83rem;}
  .bar-label{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-pct{text-align:right; font-weight:600;}
  .donut-wrap{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
  .donut{width:150px; height:150px; border-radius:50%; position:relative; display:grid; place-items:center; background:conic-gradient(var(--dc) calc(var(--pct)*1%), var(--line) 0);}
  .donut::before{content:''; position:absolute; inset:16px; border-radius:50%; background:var(--surface);}
  .donut span{position:relative; z-index:1; font-family:var(--font-serif); font-size:1.35rem; font-weight:600;}
  .donut-legend div{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.88rem;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .trend{display:flex; gap:18px; align-items:flex-end; height:150px; padding-top:10px;}
  .trend-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
  .trend-bar-wrap{height:100px; display:flex; align-items:flex-end; width:100%; justify-content:center;}
  .trend-bar{width:30px; border-radius:3px 3px 0 0; background:var(--primary);}
  .trend-pct{font-size:0.8rem; font-weight:600;}
  .trend-label{font-size:0.76rem; color:var(--muted);}
  .toggle-group{display:flex; gap:6px;}
  .toggle-btn{padding:6px 12px; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); cursor:pointer; font-size:0.78rem; font-weight:600; color:var(--muted); transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
  .toggle-btn.active-present{background:var(--success-tint); border-color:var(--success); color:var(--success);}
  .toggle-btn.active-absent{background:var(--danger-tint); border-color:var(--danger); color:var(--danger);}
  .mark-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .save-confirm{margin-left:12px; color:var(--success); font-size:0.84rem;}
  .cal-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .cal-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:0.78rem; color:var(--muted);}
  .cal-legend div{display:flex; align-items:center; gap:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; width:100%; max-width:520px; margin-left:auto; margin-right:auto; box-sizing:border-box; padding:4px;}
  .cal-cell{min-width:0; overflow:hidden; max-height:72px;}
  @media (max-width:480px){ .cal-grid{gap:3px; padding:2px;} .cal-daynum{font-size:.72rem;} .cal-pct{font-size:.58rem;} .cal-hname{font-size:.5rem;} .cal-cell{max-height:56px;} }
  .cal-dow{text-align:center; font-size:0.72rem; font-weight:600; color:var(--muted); padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); font-family:var(--font-sans); cursor:default; padding:2px;}
  .cal-cell.cal-clickable{cursor:pointer;}
  .cal-cell.cal-clickable:hover{border-color:var(--primary);}
  .cal-cell.cal-selected{outline:2px solid var(--primary); outline-offset:-2px;}
  .cal-cell.cal-empty{border:none; background:transparent;}
  .cal-cell.cal-none{color:var(--muted); background:var(--paper);}
  .cal-cell.cal-success{background:var(--success-tint); border-color:var(--success);}
  .cal-cell.cal-warning{background:var(--warning-tint); border-color:var(--warning);}
  .cal-cell.cal-holiday{background:#E9E2F3; border-color:#6B4FA0; color:#3F2A6E;}
  .cal-cell.cal-event{background:#DCEAF7; border-color:#2F6FA3; color:#1D4A73;}
  .cal-hname{font-size:0.58rem; font-weight:600; line-height:1.1; text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px;}
  .cal-hmark{position:absolute; top:3px; right:4px; width:7px; height:7px; border-radius:50%;}
  .cal-cell{position:relative;}
  .cal-cell.cal-danger{background:var(--danger-tint); border-color:var(--danger);}
  .cal-daynum{font-size:0.8rem; font-weight:600;}
  .cal-pct{font-size:0.66rem; font-weight:600;}
  .cal-detail-list{display:flex; flex-direction:column; gap:8px;}
  .cal-detail-row{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--paper); border-radius:var(--radius); font-size:0.85rem;}
  .today-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .class-btn{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:22px 20px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; min-height:120px; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;}
  .class-btn:hover{border-color:var(--primary); box-shadow:0 4px 14px rgba(0,0,0,0.08); transform:translateY(-2px);}
  .class-btn .cb-time{font-size:0.76rem; font-weight:700; color:var(--gold); letter-spacing:0.03em; text-transform:uppercase;}
  .class-btn .cb-subject{font-family:var(--font-serif); font-size:1.25rem; font-weight:600; color:var(--ink); line-height:1.2;}
  .class-btn .cb-meta{font-size:0.82rem; color:var(--muted);}
  .class-btn.cb-done{background:var(--success-tint); border-color:var(--success);}
  .class-btn.cb-done .cb-time{color:var(--success);}
  .tt-table{width:100%; border-collapse:collapse; font-size:0.84rem;}
  .tt-table th{background:var(--paper); padding:8px; border:1px solid var(--line); font-size:0.74rem; color:var(--muted);}
  .tt-table td{border:1px solid var(--line); padding:4px; vertical-align:top; min-width:120px;}
  .tt-table td select{font-size:0.78rem; padding:6px 8px;}
  .tt-cell-view{padding:10px 8px; min-height:44px; display:flex; flex-direction:column; gap:2px;}
  .tt-cell-view .tt-sub{font-weight:600; font-size:0.85rem;}
  .tt-cell-view .tt-teach{font-size:0.74rem; color:var(--muted);}
  .tt-period-label{font-weight:600; font-size:0.78rem;}
  .tt-period-time{font-size:0.7rem; color:var(--muted); font-weight:400;}
  .tt-empty-cell{color:var(--muted); font-size:0.78rem; text-align:center; padding:14px 4px;}
  .holiday-row{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px;}
  .holiday-date{font-family:var(--font-serif); font-weight:600; min-width:110px;}
  .holiday-name{flex:1; padding:0 14px;}
  .session-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; background:var(--surface);}
  .session-card .sc-head{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .session-card .sc-title{font-weight:600;}
  .session-card .sc-date{font-size:0.78rem; color:var(--muted);}
  .session-card .sc-topics{margin:8px 0; line-height:1.55; white-space:pre-wrap;}
  .file-chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .file-chip{display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:5px 12px 5px 10px; font-size:0.78rem; text-decoration:none; color:var(--ink);}
  .file-chip:hover{border-color:var(--primary);}
  button.file-chip{cursor:pointer; font-family:var(--font-sans);}
  textarea{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.92rem; font-family:var(--font-sans); resize:vertical; min-height:90px; background:var(--surface); color:var(--ink);}
  .status-pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:100px; font-size:0.8rem; font-weight:600;}
  .status-connected{background:var(--success-tint); color:var(--success);}
  .status-disconnected{background:var(--danger-tint); color:var(--danger);}
  .sql-box{background:var(--ink); color:#E4E1F5; padding:16px; border-radius:var(--radius); font-family:monospace; font-size:0.76rem; white-space:pre; overflow-x:auto; max-height:320px; overflow-y:auto;}
  .fv-backdrop{position:fixed; inset:0; background:rgba(31,27,58,.62); display:none; align-items:center; justify-content:center; padding:20px; z-index:1000;}
  .fv-backdrop.open{display:flex;}
  .fv-modal{background:var(--surface); border-radius:var(--radius); width:min(960px,100%); height:min(86vh,760px); display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.35); overflow:hidden;}
  .fv-head{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .fv-title{font-family:var(--font-serif); font-weight:600; font-size:1rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fv-meta{font-size:.75rem; color:var(--muted); white-space:nowrap;}
  .fv-body{flex:1; overflow:auto; background:var(--paper); display:flex; align-items:center; justify-content:center; min-height:0;}
  .fv-body img{max-width:100%; max-height:100%; object-fit:contain;}
  .fv-body iframe{width:100%; height:100%; border:0; background:#fff;}
  .fv-body video{max-width:100%; max-height:100%;}
  .fv-body pre{align-self:stretch; width:100%; margin:0; padding:18px 20px; white-space:pre-wrap; word-break:break-word; font-size:.82rem; background:#fff; color:var(--ink); text-align:left;}
  .fv-doc{align-self:stretch; width:100%; padding:24px 32px; background:#fff; text-align:left; line-height:1.6; font-size:.92rem; overflow:auto;}
  .fv-doc table{border-collapse:collapse; font-size:.8rem;}
  .fv-doc td,.fv-doc th{border:1px solid var(--line); padding:4px 8px;}
  .fv-doc img{max-width:100%;}
  .fv-sheet-name{font-weight:600; margin:14px 0 6px; font-size:.82rem; color:var(--muted);}
  .fv-msg{text-align:center; padding:32px; max-width:380px; color:var(--muted); font-size:.9rem; line-height:1.55;}
  .fv-msg .fv-ico{font-size:3rem; display:block; margin-bottom:10px;}
  .fv-msg b{color:var(--ink);}
  @media (max-width:600px){ .fv-backdrop{padding:0;} .fv-modal{height:100vh; width:100%; border-radius:0;} .fv-meta{display:none;} }
  #toast-host{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:1100; max-width:min(360px,calc(100vw - 36px));}
  .toast{background:var(--ink); color:#EFEDFB; border-left:4px solid var(--gold); border-radius:var(--radius); padding:12px 14px; font-size:.86rem; line-height:1.45; box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .toast b{display:block; font-family:var(--font-serif); margin-bottom:2px;}
  .toast button{margin-top:8px; background:transparent; border:1px solid #7A74B8; color:#EFEDFB; border-radius:var(--radius); padding:3px 10px; cursor:pointer; font-size:.75rem;}
  .file-chip.file-rm{padding:5px 9px; color:var(--danger); border-color:var(--danger); background:var(--danger-tint); line-height:1;}
  .file-chip.file-rm:hover{background:var(--danger); color:#fff;}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}

const ADMIN_CRED = { u:'Admin', h:'e15734e68ef984d24e5ee2985dae9ac401b054429cf3345e6a5a53642fa330a3' };   // PBKDF2 hash only — no plain password in code
(function(){
  const noop=function(){}; ['log','info','debug','warn'].forEach(k=>{ console[k]=noop; });
  document.addEventListener('contextmenu',e=>e.preventDefault());

    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))||(e.ctrlKey&&['u','s'].includes(k))||(e.metaKey&&e.altKey&&['i','j','u'].includes(k))) e.preventDefault();

async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('atl$'+salt),iterations:100000},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');

const FILE_CHUNK = 700000;
async function uploadSessionFile(f){

  const c = getSupabaseCfg(), fid = uid('F'), parts = [];
  for(let i=0;i<f.dataUrl.length;i+=FILE_CHUNK) parts.push(f.dataUrl.slice(i, i+FILE_CHUNK));
  try{
    for(let i=0;i<parts.length;i++){

async function saveSession(subjectId, classId, teacherId, date, period, topics, files){

  if(rec){ rec.topics=topics; rec.files=files; rec.teacherId=teacherId; rec.classId=classId; }
  else{ rec = {id, subjectId, classId, teacherId, date, period, topics, files}; DB.sessions.push(rec); }

async function removeSessionFile(id, idx){

  const prev = rec.files; rec.files = left;

function dataUrlToBlob(full, nameHint){
  const comma = full.indexOf(',');
  let mime = (full.slice(5, comma).split(';')[0]) || '';
  const bin = atob(full.slice(comma+1)), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  if(!mime || mime==='application/octet-stream') mime = guessMime(nameHint) || mime || 'application/octet-stream';
  return new Blob([bytes], {type:mime});
}
function fileExt(name){ const m = /\.([a-z0-9]+)$/i.exec(name||''); return m ? m[1].toLowerCase() : ''; }
function guessMime(name){
  return ({pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml',
    mp4:'video/mp4', webm:'video/webm', mp3:'audio/mpeg', wav:'audio/wav', txt:'text/plain', csv:'text/csv'})[fileExt(name)] || '';
}
const FILE_CACHE = new Map();
async function fetchSessionFileBlob(f){
  if(f.dataUrl) return dataUrlToBlob(f.dataUrl, f.name);
  if(FILE_CACHE.has(f.fid)) return FILE_CACHE.get(f.fid);
  const c = getSupabaseCfg(), pieces = [];
  for(let i=0;i<f.chunks;i++){
    const o = await fsGet(c,'/sessionfiles/'+encodeURIComponent(f.fid+'_'+i)); const data=o&&o.fields&&o.fields.data&&o.fields.data.stringValue; if(!data) throw new Error('File chunk missing'); pieces.push(data);
  }
  const blob = dataUrlToBlob(pieces.join(''), f.name); FILE_CACHE.set(f.fid, blob); return blob;
}
function fileKind(name, mime){
  const e = fileExt(name);
  if(/^image\//.test(mime) || ['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e)) return 'image';
  if(mime==='application/pdf' || e==='pdf') return 'pdf';
  if(/^video\//.test(mime) || ['mp4','webm','ogv'].includes(e)) return 'video';
  if(/^audio\//.test(mime) || ['mp3','wav','ogg','m4a'].includes(e)) return 'audio';
  if(['xlsx','xls','csv'].includes(e)) return 'sheet';
  if(e==='docx') return 'docx';
  if(['txt','md','json','log','xml','html','js','css','py','java','c','cpp'].includes(e) || /^text\//.test(mime)) return 'text';
  return 'other';
}

    if(/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
  }));
  return doc.body.innerHTML;
}

const MAX_FILE_BYTES = 2 * 1024 * 1024; // 2MB per file (stored as chunks in Firestore)
function readFilesAsDataUrls(fileList){
  const files = Array.from(fileList || []);
  const oversized = files.filter(f=>f.size > MAX_FILE_BYTES);
  const accepted = files.filter(f=>f.size <= MAX_FILE_BYTES);
  const readers = accepted.map(f=> new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=> res({name:f.name, size:f.size, dataUrl:r.result});
    r.onerror = ()=> res(null);
    r.readAsDataURL(f);
  }));
  return Promise.all(readers).then(results=>({
    files: results.filter(Boolean),
    oversized: oversized.map(f=>f.name)
  }));
}

function applyBrand(){
  const b = getSetting('brand', {}), custom = !!b.logo, nm = escapeHtml(b.tagline || b.name || 'Attendance Ledger');
  $('#topbar .brand').innerHTML = '<img src="'+(custom?b.logo:DEFAULT_MARK)+'" class="brand-logo" alt=""><span>'+nm+'</span>';
  const bx = $('#brand-box'); if(!bx) return;
  bx.innerHTML = '<div class="hero-logo-card"><img src="'+(custom?b.logo:DEFAULT_LOGO)+'" class="brand-logo" alt="'+nm+'"></div>'
    + (custom && (b.tagline||b.name) ? '<div class="brand-tag">'+nm+'</div>' : '')
    + (b.details ? '<p class="brand-details">'+escapeHtml(b.details).replace(/\n/g,'<br>')+'</p>' : '');
  if(custom) document.querySelectorAll('.brand-logo').forEach(im=>cleanLogo(b.logo).then(u=>{ im.src=u; }));
}
function readLogo(file, cb){ const r = new FileReader(); r.onload = ()=>{ const im = new Image(); im.onload = ()=>{ const s = Math.min(1, 600/Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/png')); }; im.src = r.result; }; r.readAsDataURL(file); }
function dateForDay(day){ const d = new Date(); d.setDate(d.getDate() - (d.getDay()+6)%7 + WEEKDAYS.indexOf(day)); return d.toLocaleDateString('en-CA'); }
function teacherClassesOn(teacher, day){
  const ids = new Set(DB.subjects.filter(su=>su.teacherId===teacher.id).map(s=>s.id));
  return DB.timetable.filter(tt=>tt.day===day && ids.has(tt.subjectId)).sort((a,b)=>a.period-b.period);
}
function teacherName(su){ const t = DB.teachers.find(x=>x.id===su.teacherId); return t ? t.name : 'no faculty'; }
function fmtMin(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function periodRowsHtml(list){ return list.map((p,i)=>'<div class="pc-row"><b>P'+(i+1)+'</b><input type="time" class="pc-s" value="'+p[0]+'"/><span>to</span><input type="time" class="pc-e" value="'+p[1]+'"/></div>').join(''); }
function toMin(t){ const x=String(t||'').split(':').map(Number); return (x[0]||0)*60+(x[1]||0); }
function savedPeriodList(){ return PERIODS.map(p=>PERIOD_TIMES[p].split(' – ')); }
function curPeriodList(){ return state.periodDraft || savedPeriodList(); }
function periodGenValues(){
  const cur=curPeriodList(), g=state.periodGen||{};
  const d0=Math.max(5, toMin(cur[0][1])-toMin(cur[0][0])) || 50;
  return {n:g.n!=null?g.n:cur.length, start:g.start||cur[0][0]||'09:00', dur:g.dur!=null?g.dur:d0, b1:g.b1!=null?g.b1:2, b1m:g.b1m!=null?g.b1m:10, b2:g.b2!=null?g.b2:4, b2m:g.b2m!=null?g.b2m:45};
}
function periodEditorHtml(){
  const g=periodGenValues();
  const f = (id,l,v,t)=>'<div class="field"><label>'+l+'</label><input id="'+id+'" type="'+(t||'number')+'" value="'+v+'" min="0"/></div>';
  return '<div class="card"><h3>Periods &amp; timings</h3><p class="sub" style="margin-bottom:10px;">Change any value to regenerate the times, or edit a single start/end time directly. Saved together with the timetable by <b>Save &amp; publish</b>, and applies to every class.</p>'
    +'<div class="form-row">'+f('pc-n','Periods per day',g.n)+f('pc-start','First period starts',g.start,'time')+f('pc-dur','Minutes per period',g.dur)
    +f('pc-b1','Short break after period',g.b1)+f('pc-b1m','Break minutes',g.b1m)+f('pc-b2','Lunch after period',g.b2)+f('pc-b2m','Lunch minutes',g.b2m)+'</div>'
    +'<div id="pc-rows">'+periodRowsHtml(curPeriodList())+'</div></div>';
}
function genPeriodList(g){
  let t=toMin(g.start), list=[]; const n=Math.max(1,Math.min(12,g.n||1));
  for(let i=1;i<=n;i++){ list.push([fmtMin(t), fmtMin(t+g.dur)]); t+=g.dur; if(i===g.b1) t+=g.b1m; if(i===g.b2) t+=g.b2m; }
  return list;
}
function setPeriodDraft(list){ state.periodDraft = (JSON.stringify(list)===JSON.stringify(savedPeriodList())) ? null : list; }
function bindPeriodEditor(onChange){
  const num=id=>Number($('#'+id).value)||0;
  const regen=()=>{
    const g={n:num('pc-n'), start:$('#pc-start').value||'09:00', dur:Math.max(5,num('pc-dur')), b1:num('pc-b1'), b1m:num('pc-b1m'), b2:num('pc-b2'), b2m:num('pc-b2m')};
    if(g.n<1) return;
    state.periodGen=g; const list=genPeriodList(g); setPeriodDraft(list);
    $('#pc-rows').innerHTML=periodRowsHtml(list); onChange();
  };
  ['pc-n','pc-start','pc-dur','pc-b1','pc-b1m','pc-b2','pc-b2m'].forEach(id=>$('#'+id).addEventListener('input',regen));
  $('#pc-rows').addEventListener('input',()=>{
    const st=$all('.pc-s').map(x=>x.value), en=$all('.pc-e').map(x=>x.value);
    setPeriodDraft(st.map((x,i)=>[x,en[i]])); onChange();
  });
}

    const h=await hashPw(pass,'admin');

    if(A.email && BACKEND_ON()){

const OTPS = {};     // key -> {id,h,exp,tries,sentAt}; only a hash of the code is kept in memory
async function otpDrop(key){
  const r=OTPS[key]; if(!r) return; delete OTPS[key];
  try{ const c=getSupabaseCfg(); await fsPost(c,':commit',{writes:[{delete:fsRoot(c)+'/mail/'+r.id}]}); }catch(e){}
}
async function otpIssue(key, to, purpose){
  const prev=OTPS[key]; if(prev && Date.now()-prev.sentAt<30000) throw new Error('wait 30 seconds before asking for another code');
  await otpDrop(key);
  const code=String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
  const id=uid('otp_');
  const what = purpose==='login' ? 'sign in to the admin portal' : 'confirm a change to the admin details';
  const m={subject:'Your verification code',
    text:'Your verification code to '+what+' is '+code+'.\n\nIt is valid for 5 minutes. If this was not you, ignore this e-mail and change the admin password.\n\n'+collegeName(),
    html:mailWrap('Verification code','<p>Use this code to '+escapeHtml(what)+':</p><p style="font-size:28px;letter-spacing:6px;font-weight:700;margin:12px 0;">'+code+'</p><p>It is valid for 5 minutes. If this was not you, ignore this e-mail and change the admin password.</p>')};
  await queueMail(id,{to:normEmail(to),subject:m.subject,text:m.text,html:m.html,kind:'otp',by:'system'},false);
  OTPS[key]={id, h:await hashPw(code,'otp'+id), exp:Date.now()+300000, tries:0, sentAt:Date.now()};
}
async function otpCheck(key, code){
  const r=OTPS[key]; if(!r) return {s:'expired'};
  if(Date.now()>r.exp){ otpDrop(key); return {s:'expired'}; }
  r.tries++;
  if((await hashPw(String(code||'').trim(),'otp'+r.id))===r.h){ await otpDrop(key); return {s:'ok'}; }
  if(r.tries>=5){ otpDrop(key); return {s:'locked'}; }
  return {s:'bad', left:5-r.tries};
}

const FP_APP_ONLY = true;
const FP_KEY='atl_fp', FP_NO='atl_fp_no';
function fpList(){ try{ return JSON.parse(localStorage.getItem(FP_KEY)||'[]'); }catch(e){ return []; } }
function fpSave(l){ try{ localStorage.setItem(FP_KEY, JSON.stringify(l)); }catch(e){} }
function fpIsApp(){ return !FP_APP_ONLY || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
async function fpAvailable(){
  try{ return !!(window.PublicKeyCredential && window.isSecureContext && fpIsApp() && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch(e){ return false; }

function fpB64(buf){ let b=''; new Uint8Array(buf).forEach(x=>{ b+=String.fromCharCode(x); }); return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fpUn(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; return Uint8Array.from(atob(str),c=>c.charCodeAt(0)); }
function fpRole(){ const t=document.querySelector('.role-tab.active'); return (t&&t.dataset.role)||'student'; }
function fpWho(){
  if(state.role==='student'){ const x=DB.students.find(v=>v.id===state.studentId); return x&&{role:'student',key:x.id,name:x.name}; }
  if(state.role==='teacher'){ const x=DB.teachers.find(v=>v.id===state.teacherId); return x&&{role:'teacher',key:x.id,name:x.name}; }
  if(state.role==='admin') return {role:'admin',key:'admin',name:'Administrator'};
  return null;
}
async function fpOffer(){
  try{
    if(!(await fpAvailable())) return;
    const w=fpWho(); if(!w || w.role==='admin') return;
    const id=w.role+':'+w.key;
    if(fpList().some(e=>e.id===id)) return;
    let no=[]; try{ no=JSON.parse(localStorage.getItem(FP_NO)||'[]'); }catch(e){}
    if(no.includes(id)) return;
    if(!confirm('Use your fingerprint to sign in next time on this device?')){ no.push(id); try{ localStorage.setItem(FP_NO, JSON.stringify(no)); }catch(e){} return; }
    const cred = await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Attendance Ledger'},
      user:{id:new TextEncoder().encode(id), name:w.name, displayName:w.name},
      pubKeyCredParams:[{type:'public-key',alg:-7}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'},
      attestation:'none', timeout:60000
    }});
    const l=fpList().filter(e=>e.id!==id);
    l.push({id, role:w.role, key:w.key, name:w.name, cid:fpB64(cred.rawId), pk:(cred.response.getPublicKey?fpB64(cred.response.getPublicKey()):'')});
    fpSave(l);
    showToast('Fingerprint enabled','You can now sign in with your fingerprint on this device.');
  }catch(e){ /* cancelled or not supported: continue with normal sign-in */ }
}
function fpDerToRaw(der){
  der=new Uint8Array(der); let i=2;
  const rl=der[i+1], r=der.slice(i+2,i+2+rl); i=i+2+rl;
  const sl=der[i+1], sg=der.slice(i+2,i+2+sl);
  const fix=x=>{ while(x.length>32&&x[0]===0) x=x.slice(1); const o=new Uint8Array(32); o.set(x,32-x.length); return o; };
  const out=new Uint8Array(64); out.set(fix(r),0); out.set(fix(sg),32); return out;
}
async function fpSignIn(){
  const role=fpRole();
  showLoginError(role,'');
  if(role==='admin'){ showLoginError(role,'Admin sign-in needs your password and an e-mail code.'); return; }
  if(lockLeft()){ showLoginError(role,'Too many attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
  const list=fpList().filter(e=>e.role===role); if(!list.length) return;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const a=await navigator.credentials.get({publicKey:{challenge, allowCredentials:list.map(e=>({type:'public-key',id:fpUn(e.cid)})), userVerification:'required', timeout:60000}});
    const e=list.find(x=>x.cid===fpB64(a.rawId)); if(!e) throw new Error('unknown');
    const r=a.response, ad=new Uint8Array(r.authenticatorData);
    if(!(ad[32]&0x04)) throw new Error('not verified');
    const cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
    if(cd.type!=='webauthn.get' || cd.challenge!==fpB64(challenge) || cd.origin!==location.origin) throw new Error('bad data');
    if(e.pk){
      const key=await crypto.subtle.importKey('spki',fpUn(e.pk),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      const h=new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON));
      const data=new Uint8Array(ad.length+32); data.set(ad,0); data.set(h,ad.length);
      if(!(await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,fpDerToRaw(r.signature),data))) throw new Error('bad signature');
    }
    if(role==='student'){ const s=BACKEND_ON()?await fetchById('students',e.key):DB.students.find(x=>x.id===e.key); if(!s) throw new Error('gone'); LOGIN_STU=s; state.role='student'; state.studentId=s.id; if(BACKEND_ON()) await loadStudentScope(s); }
    else if(role==='teacher'){ const t=BACKEND_ON()?await fetchById('teachers',e.key):DB.teachers.find(x=>x.id===e.key); if(!t) throw new Error('gone'); state.role='teacher'; state.teacherId=t.id; state.teacherTab='dashboard'; if(BACKEND_ON()) await loadFull(); }
    else { if(BACKEND_ON()) await loadFull(); state.role='admin'; state.adminTab='overview'; migrateTeacherPasswords(); }
    okLogin(); enterApp();
  }catch(err){
    showLoginError(role, err&&err.name==='NotAllowedError' ? 'Fingerprint was cancelled. Try again or use your password.' : 'Fingerprint sign-in failed. Please use your password.');
  }
}

   onCellClick(day, period, entry) — if provided, cells become clickable (used by admin editor via renderAdminTimetable itself). */
function timetableGridHtml(classId, highlightTeacherId, opts){
  opts=opts||{}; const DAYS=(opts.day&&opts.day!=='all')?[opts.day]:WEEKDAYS;
  let rows = '<tr><th>Period</th>' + DAYS.map(d=>'<th>'+d+'</th>').join('') + '</tr>';
  PERIODS.forEach(period=>{
    if(opts.period && opts.period!=='all' && Number(opts.period)!==period) return;
    rows += '<tr><td class="tt-period-label">P'+period+'<div class="tt-period-time">'+PERIOD_TIMES[period]+'</div></td>';
    DAYS.forEach(day=>{
      const entry = timetableEntry(classId, day, period);
      const su = entry ? DB.subjects.find(x=>x.id===entry.subjectId) : null;
      const t = su ? DB.teachers.find(x=>x.id===su.teacherId) : null;
      if(opts.mine&&highlightTeacherId&&!(su&&su.teacherId===highlightTeacherId)){ rows+='<td><div class="tt-empty-cell">—</div></td>'; return; }
      if(su){
        const dim = highlightTeacherId && su.teacherId!==highlightTeacherId;
        rows += '<td><div class="tt-cell-view" style="'+(dim?'opacity:.35;':'')+'"><span class="tt-sub">'+escapeHtml(su.name)+'</span>'+(t?'<span class="tt-teach">'+escapeHtml(t.name)+'</span>':'')+'</div></td>';
      } else if(entry && entry.text){
        const dim = highlightTeacherId ? 'opacity:.35;' : '';
        rows += '<td><div class="tt-cell-view" style="'+dim+'"><span class="tt-sub">'+escapeHtml(entry.text)+'</span></div></td>';
      } else {
        rows += '<td><div class="tt-empty-cell">—</div></td>';
      }
    });
    rows += '</tr>';
  });
  return '<table class="tt-table">'+rows+'</table>';
}

function studentReportData(student, f){
  const subjects = DB.subjects.filter(su=>su.classId===student.classId);
  const ids = new Set(subjects.map(x=>x.id));
  let recs = DB.attendance.filter(a=>a.studentId===student.id && ids.has(a.subjectId));
  if(f.subject!=='all') recs = recs.filter(a=>a.subjectId===f.subject);
  if(f.from || f.to){ if(f.from) recs=recs.filter(a=>a.date>=f.from); if(f.to) recs=recs.filter(a=>a.date<=f.to); }
  else if(f.month!=='all') recs = recs.filter(a=>a.date.startsWith(f.month));
  recs = recs.slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:a.period-b.period));
  const list = (f.subject==='all'?subjects:subjects.filter(x=>x.id===f.subject)).map(su=>{
    const rr = recs.filter(a=>a.subjectId===su.id), held=rr.length, present=rr.filter(a=>a.status==='P').length;
    let hm=0, pm=0; rr.forEach(a=>{ const m=perMins(a.period); hm+=m; if(a.status==='P') pm+=m; });
    return {su, held, present, absent:held-present, pct: held?Math.round(present/held*1000)/10:0, hm, pm};
  });
  const T = list.reduce((t,x)=>({held:t.held+x.held, present:t.present+x.present, hm:t.hm+x.hm, pm:t.pm+x.pm}),{held:0,present:0,hm:0,pm:0});
  T.absent = T.held-T.present; T.pct = T.held ? Math.round(T.present/T.held*1000)/10 : 0;
  return {student, subjects, recs, list, T};
}

function holValidate(d){
  const ymd=/^\d{4}-\d{2}-\d{2}$/;
  if(!d.name) return 'Enter a name for the holiday / event.';
  if(d.name.length>80) return 'The name is too long (80 characters max).';
  if(!ymd.test(d.date) || isNaN(new Date(d.date+'T00:00:00'))) return 'Choose a valid From date.';
  if(!ymd.test(d.toDate) || isNaN(new Date(d.toDate+'T00:00:00'))) return 'Choose a valid To date.';
  if(d.toDate<d.date) return 'The To date cannot be before the From date.';
  if(dayCount(d)>366) return 'A holiday / event can cover at most 366 days.';
  if(String(d.details||'').length>300) return 'The notes are too long (300 characters max).';
  return '';
}
function holDuplicate(d, exceptId){ return instHolidays().find(h=>h.id!==exceptId && String(h.name).trim().toLowerCase()===d.name.toLowerCase() && h.date===d.date && hEnd(h)===d.toDate); }
async function holVerify(rec){
  if(!BACKEND_ON()) return true;
  try{
    const row=await fetchById('holidays',rec.id); if(!row) return false;
    const d=await decodeHolidayRow(row);
    return !d._bad && d.name===rec.name && d.date===rec.date && (d.toDate||d.date)===(rec.toDate||rec.date) && (d.details||'')===(rec.details||'') && Number(d.period||0)===Number(rec.period||0);
  }catch(e){ return false; }
}
async function holCommit(rec){
  const i=DB.holidays.findIndex(h=>h.id===rec.id), prev=i>=0?DB.holidays[i]:null;
  if(i>=0) DB.holidays[i]=rec; else DB.holidays.push(rec);
  if(!BACKEND_ON()) return {ok:true, verified:false, local:true};
  const ok=await syncUpsert('holidays',rec);
  if(ok===false){ if(prev){ const j=DB.holidays.findIndex(h=>h.id===rec.id); if(j>=0) DB.holidays[j]=prev; } else DB.holidays=DB.holidays.filter(h=>h.id!==rec.id); return {ok:false}; }
  return {ok:true, verified:await holVerify(rec)};
}
async function holRemove(id){
  const prev=DB.holidays.find(h=>h.id===id); if(!prev) return true;
  DB.holidays=DB.holidays.filter(h=>h.id!==id);
  if(!BACKEND_ON()) return true;
  const ok=await syncDelete('holidays',id);
  let still=null; if(ok!==false){ try{ still=await fetchById('holidays',id); }catch(e){} }
  if(ok===false || still){ DB.holidays.push(prev); return false; }
  return true;
}

function teacherDayStats(teacher, subjectFilter, dateStr){
  let recs = DB.attendance.filter(a=>a.teacherId===teacher.id && a.date===dateStr);
  if(subjectFilter!=='all') recs = recs.filter(a=>a.subjectId===subjectFilter);
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

function renderRecResults(teacher){
  let recs = DB.attendance.filter(a=>a.teacherId===teacher.id);
  if(state.recFilters.subject!=='all') recs = recs.filter(a=>a.subjectId===state.recFilters.subject);
  if(state.recFilters.date) recs = recs.filter(a=>a.date===state.recFilters.date);          // a chosen day overrides the month filter
  else if(state.recFilters.month!=='all') recs = recs.filter(a=>a.date.startsWith(state.recFilters.month));
  if(state.recFilters.period==='sp') recs = recs.filter(a=>isSp(a.period));
  else if(state.recFilters.period!=='all') recs = recs.filter(a=>String(a.period)===String(state.recFilters.period));
  if(state.recFilters.q){
    const q = state.recFilters.q.toLowerCase();
    recs = recs.filter(a=>{ const s=DB.students.find(st=>st.id===a.studentId); return s && (s.name.toLowerCase().includes(q) || s.regNo.toLowerCase().includes(q)); });
  }
  recs = recs.slice().sort((a,b)=> a.date<b.date?1:-1).slice(0,150);

function trPerSet(f){ return f.per && f.per.length ? new Set(f.per) : null; }
function trSlotLabel(sl){ return dmy(sl.date)+' ('+(isSp(sl.period)?'Special '+perTime(sl.period).replace(/ /g,''):'P'+sl.period)+')'; }
function trMatrix(subject, f){
  const per = trPerSet(f);
  let recs = DB.attendance.filter(a=>a.subjectId===subject.id);
  if(f.from || f.to){ if(f.from) recs=recs.filter(a=>a.date>=f.from); if(f.to) recs=recs.filter(a=>a.date<=f.to); }
  else if(f.month!=='all') recs = recs.filter(a=>a.date.startsWith(f.month));
  if(per) recs = recs.filter(a=>per.has(isSp(a.period)?'sp':String(a.period)));
  const seen={}, slots=[], map={};
  recs.forEach(a=>{ const k=a.date+'|'+a.period; map[a.studentId+'|'+k]=a.status; if(!seen[k]){ seen[k]=1; slots.push({key:k, date:a.date, period:a.period, mins:perMins(a.period)}); } });
  slots.sort((x,y)=> x.date<y.date?-1:(x.date>y.date?1:x.period-y.period));
  const students = DB.students.filter(st=>st.classId===subject.classId).slice().sort((x,y)=>String(x.regNo).localeCompare(String(y.regNo),undefined,{numeric:true}));
  const rows = students.map(st=>{
    const cells = slots.map(sl=>map[st.id+'|'+sl.key]||'-');
    const held = cells.filter(c=>c!=='-').length, present = cells.filter(c=>c==='P').length;
    let pm=0; cells.forEach((c,i)=>{ if(c==='P') pm+=slots[i].mins; });
    return {student:st, cells, held, present, pm, pct: held ? Math.round(present/held*1000)/10 : 0};
  });
  const totalMin = slots.reduce((t,x)=>t+x.mins,0);
  return {subject, slots, rows, totalMin, spCount:slots.filter(x=>isSp(x.period)).length};
}
function trRangeLabel(f){
  if(f.from||f.to) return (f.from?dmy(f.from):'start')+' to '+(f.to?dmy(f.to):'today');
  if(f.month!=='all'){ const m=monthsData.find(x=>x.prefix===f.month); return m? m.name+' '+m.prefix.slice(0,4) : f.month; }
  return 'All dates';
}
function trPerLabel(f){
  const per=trPerSet(f); if(!per) return 'All periods (incl. special classes)';
  return Array.from(per).sort().map(k=>k==='sp'?'Special classes':'P'+k).join(', ');
}
function trSheetRows(M, f){
  const header = ['Name','Reg No'].concat(M.slots.map(trSlotLabel)).concat(['Present','Held','Total % (selected periods)']);
  const body = M.rows.map(r=>[r.student.name, r.student.regNo].concat(r.cells).concat([r.present, r.held, r.pct+'%']));
  const dur = ['Class duration (hours)',''].concat(M.slots.map(x=>hrsNum(x.mins))).concat(['','','']);
  const tot = ['Total class hours','',hrsNum(M.totalMin)].concat(M.slots.slice(1).map(()=>'')).concat(['','','']);
  return [header].concat(body, [[]], [dur], [tot]);
}

async function saveTimetable(){
  let ups=[], dels=[];
  Object.keys(state.ttDraft).forEach(k=>{ const v=state.ttDraft[k]; if(v===null){ if(DB.timetable.some(t=>t.id===k)) dels.push(k); } else ups.push(v); });
  let setRec=null;
  if(state.periodDraft){
    const pl=state.periodDraft;
    if(pl.some(x=>!x[0]||!x[1]||toMin(x[1])<=toMin(x[0]))){ alert('Every period needs a start time and an end time that is later than its start.'); return; }
    setRec={id:'periods', value:JSON.stringify(pl.map(x=>({s:x[0],e:x[1]})))};
    if(pl.length<PERIODS.length){
      const orphans=DB.timetable.filter(t=>t.period>pl.length);
      if(orphans.length && !confirm('Reducing to '+pl.length+' periods will remove '+orphans.length+' timetable entries that sit in the later periods. Continue?')) return;
      orphans.forEach(t=>{ if(!dels.includes(t.id)) dels.push(t.id); });
      ups=ups.filter(u=>u.period<=pl.length);
    }
  }
  Object.keys(state.ttDraft).forEach(k=>{ const v=state.ttDraft[k]; DB.timetable.forEach(t=>{ if((!v||t.id!==v.id) && ttKey(t.classId,t.day,t.period)===k && !dels.includes(t.id)) dels.push(t.id); }); });
  const btn=$('#tt-save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const parts=[{table:'timetable',ups,dels}]; if(setRec) parts.push({table:'settings',ups:[setRec],dels:[]});
  const ok=await syncMulti(parts);
  if(!ok){ alert('Could not save — check your connection. Your changes are still here.'); renderAdminTimetable(); return; }
  const ids=new Set(dels.concat(ups.map(u=>u.id)));
  DB.timetable=DB.timetable.filter(t=>!ids.has(t.id)).concat(ups);
  if(setRec){ const i=DB.settings.findIndex(x=>x.id==='periods'); if(i>=0) DB.settings[i]=setRec; else DB.settings.push(setRec); applyPeriodConfig(); }
  state.ttDraft={}; state.periodDraft=null; state.periodGen=null; state.ttSaved=new Date(); renderAdminTimetable();
}

/* Reads a workbook downloaded from the old Google Sheet (tabs: classes, teachers, subjects,
   students, attendance; timetable/holidays/sessions optional) and loads it into the app. */
const IMPORT_SCHEMA = {
  classes:['id','course','semester','section','year'],
  teachers:['id','teacherId','name','password','passHash','status','email','phone'],
  subjects:['id','code','name','semester','teacherId','classId'],
  students:['id','regNo','name','dob','gender','course','dept','semester','section','email','phone','admissionYear','status','classId'],
  attendance:['id','studentId','subjectId','teacherId','date','period','status'],
  timetable:['id','classId','day','period','subjectId'],
  holidays:['id','date','name','type','toDate','details','kind','classId','subjectId','teacherId','period','by','byName'],
  sessions:['id','subjectId','classId','teacherId','date','period','topics','files'],
  settings:['id','value']
};
const IMPORT_NUM = {semester:1, period:1};
function normImportCell(k, v){
  if(v === null || v === undefined || v === '') return IMPORT_NUM[k] ? null : (k === 'files' ? [] : '');
  if(v instanceof Date){ return new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  if(IMPORT_NUM[k]){ const n = Number(v); return isNaN(n) ? null : n; }
  if(k === 'files'){ try{ return JSON.parse(v); }catch(e){ return []; } }
  return String(v).trim();
}
function workbookToTables(wb){
  const tables = {}; let found = 0;
  SYNC_TABLES.forEach(t=>{
    const name = wb.SheetNames.find(n=>n.trim().toLowerCase() === t);
    if(!name){ tables[t] = []; return; }
    found++;
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:'', raw:true});
    tables[t] = raw.map(r=>{
      const lower = {}; Object.keys(r).forEach(h=>{ lower[h.trim().toLowerCase()] = r[h]; });
      const o = {};
      IMPORT_SCHEMA[t].forEach(k=>{ o[k] = normImportCell(k, lower[k.toLowerCase()]); });
      return o;
    }).filter(o=>o.id);
  });
  return {tables, found};
}
function handleOldWorkbook(e){
  const input = e.target, file = input.files && input.files[0];
  if(!file) return;
  const st = $('#import-status');
  if(typeof XLSX === 'undefined'){ alert('Excel support failed to load — check your internet connection and reload the page.'); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const wb = XLSX.read(reader.result, {type:'array', cellDates:true});
      const res = workbookToTables(wb);
      if(!res.found){ alert('None of the expected tabs (classes, teachers, subjects, students, attendance) were found in that file.'); return; }
      const summary = SYNC_TABLES.map(t=> t+': '+res.tables[t].length+' rows').join('\n');
      if(!confirm('Replace ALL data currently in this app with the contents of this file?\n\n'+summary)) return;
      SYNC_TABLES.forEach(t=>{ if(t==='settings' && !res.tables[t].length) return; DB[t] = res.tables[t]; });
      applyPeriodConfig(); applyBrand();
      if(BACKEND_ON()){
        st.textContent = 'Imported. Uploading to Firebase…';
        await syncSeedAll();
        st.textContent = 'Imported and uploaded to Firebase.';
      } else {
        st.textContent = 'Imported into this session. Now enter your Firebase details above and click Save & test connection to upload it.';
      }
    }catch(err){ alert('Could not read that file: '+err.message); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function importStudentRows(rows){
  const imported = [];
  rows.forEach(cols=>{
    if(!cols || cols.length<2) return;
    const regNo=String(cols[0]||'').trim(), name=String(cols[1]||'').trim();
    if(!regNo && !name) return;
    const dob=cols[2]||'', gender=cols[3]||'', course=cols[4]||'', dept=cols[5]||'', semester=cols[6], section=cols[7]||'', email=cols[8]||'', phone=cols[9]||'', admissionYear=cols[10]||'', status=cols[11]||'';
    const cls = DB.classes.find(c=>c.course===course && String(c.semester)===String(semester) && c.section===section) || DB.classes[0];
    if(!cls) return;
    const rec = {
      id:uid('ST'), regNo:regNo||'', name:name||'Unnamed', dob:String(dob||''), gender:gender||'Other',
      course:cls.course, dept:dept||'Commerce', semester:cls.semester, section:cls.section,
      email:email||'', phone:String(phone||''), admissionYear:String(admissionYear||''), status:status||'Active', classId:cls.id
    };
    DB.students.push(rec);
    imported.push(rec);
  });
  syncBulkUpsert('students', imported);
  renderAdminStudents();
  alert('Imported '+imported.length+' student'+(imported.length===1?'':'s')+'.');
}
function handleImportStudents(e){
  const file = e.target.files[0];
  if(!file) return;
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      if(isExcel){
        if(typeof XLSX === 'undefined'){ alert('Excel support failed to load — try a CSV file instead.'); return; }
        const wb = XLSX.read(reader.result, {type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
        importStudentRows(rows.slice(1));
      } else {
        const lines = reader.result.split(/\r?\n/).filter(l=>l.trim());
        const rows = lines.slice(1).map(line=>line.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
        importStudentRows(rows);
      }
    }catch(err){
      alert('Could not read that file: '+err.message);
    }
  };
  if(isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
  e.target.value = '';
}

function filteredAdminAttendance(){
  const f = state.adminAttFilters;
  let recs = DB.attendance.slice();
  if(f.classId!=='all'){
    const ids = new Set(DB.students.filter(s=>s.classId===f.classId).map(s=>s.id));
    recs = recs.filter(a=>ids.has(a.studentId));
  }
  if(f.subjectId!=='all') recs = recs.filter(a=>a.subjectId===f.subjectId);
  if(f.teacherId!=='all') recs = recs.filter(a=>a.teacherId===f.teacherId);
  if(f.month!=='all') recs = recs.filter(a=>a.date.startsWith(f.month));
  if(f.from) recs = recs.filter(a=>a.date>=f.from);
  if(f.to) recs = recs.filter(a=>a.date<=f.to);
  if(f.status) recs = recs.filter(a=>a.status===f.status);
  if(f.q){
    const q = f.q.toLowerCase();
    recs = recs.filter(a=>{ const s=DB.students.find(st=>st.id===a.studentId); return s && (s.name.toLowerCase().includes(q) || s.regNo.toLowerCase().includes(q)); });
  }
  return recs.sort((a,b)=> a.date<b.date?1:-1);
}

function adminDayStats(classFilter, dateStr){
  let recs = DB.attendance.filter(a=>a.date===dateStr);
  if(classFilter!=='all'){
    const ids = new Set(DB.students.filter(s=>s.classId===classFilter).map(s=>s.id));
    recs = recs.filter(a=>ids.has(a.studentId));
  }
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

const DASH = '<span style="color:var(--muted)">—</span>';
function clsLabel(c){ return c ? c.course+' S'+c.semester+'-'+c.section : '—'; }
/* The app queues each email as a document in the Firestore "mail" collection. The Firebase extension
   "Trigger Email from Firestore" (see the setup card on Admin > Admin Account) actually delivers it by SMTP. */
function collegeName(){ return (getSetting('brand',{}).name||'').trim() || 'Attendance Ledger'; }
function mailFields(m){
  const S=v=>({stringValue:String(v)});
  return {
    to:S(m.to),
    message:{mapValue:{fields:{subject:S(m.subject), text:S(m.text), html:S(m.html)}}},
    kind:S(m.kind), by:S(m.by), teacherId:S(m.teacherId||''), createdAt:{integerValue:String(Date.now())},
    expireAt:{timestampValue:new Date(Date.now()+(m.kind==='otp'?1:30)*86400000).toISOString()}   // optional: a Firestore TTL policy could use this (needs the paid plan); the app cleans up old mails itself
  };
}
async function queueMail(id, m, once){
  const c=getSupabaseCfg();
  const w={update:{name:fsRoot(c)+'/mail/'+id, fields:mailFields(m)}};
  if(once) w.currentDocument={exists:false};
  try{ await fsPost(c,':commit',{writes:[w]}); return 'queued'; }
  catch(e){ if(once && /HTTP 409/.test(e.message)) return 'duplicate'; throw e; }
}
function mailWrap(title, inner){
  return '<div style="font-family:Arial,sans-serif;max-width:560px;color:#1F1B3A;"><h2 style="color:#4338A8;margin:0 0 10px;">'+escapeHtml(title)+'</h2>'+inner
    +'<p style="color:#6B6680;font-size:12px;margin-top:22px;">'+escapeHtml(collegeName())+' · automated message</p></div>';
}
function attendanceMarkedMail(owner, marker, subject, cls, date, period, recs, isUpdate){
  const present=recs.filter(r=>r.status==='P').length, total=recs.length, absent=total-present;
  const pct=total?Math.round((present/total)*1000)/10:0;
  const abs=recs.filter(r=>r.status==='A').map(r=>DB.students.find(s=>s.id===r.studentId)).filter(Boolean).sort((a,b)=>String(a.regNo).localeCompare(String(b.regNo)));
  const shown=abs.slice(0,100), more=abs.length-shown.length;
  const where=clsLabel(cls), time=perTime(period)||'';
  const verb=isUpdate?'updated':'marked';
  const subjectLine='Attendance '+verb+': '+subject.name+' · '+where+' · '+date+' ('+perName(period)+')';
  const td='padding:6px 10px;border-bottom:1px solid #E3DCCB;';
  const absRows=shown.map(s=>'<tr><td style="'+td+'">'+escapeHtml(s.regNo)+'</td><td style="'+td+'">'+escapeHtml(s.name)+'</td></tr>').join('');
  const text='Hello '+owner.name+',\n\nAttendance was '+verb+' for '+subject.name+' ('+where+') on '+date+', '+perName(period)+(time?' ('+time+')':'')+'.\n'
    +'Marked by: '+marker.name+'\nPresent: '+present+'  Absent: '+absent+'  Total: '+total+'  ('+pct+'% present)\n'
    +(abs.length?'\nAbsent students:\n'+shown.map(s=>s.regNo+' - '+s.name).join('\n')+(more>0?'\n...and '+more+' more':'')+'\n':'\nNo absentees.\n')
    +'\n'+collegeName();
  const html=mailWrap('Attendance '+verb,
    '<p>Hello '+escapeHtml(owner.name)+',</p>'
    +'<p><b>'+escapeHtml(subject.name)+'</b> · '+escapeHtml(where)+'<br>'+escapeHtml(date)+' · '+perName(period)+(time?' ('+escapeHtml(time)+')':'')+'<br>Marked by '+escapeHtml(marker.name)+'</p>'
    +'<p style="font-size:15px;"><b style="color:#2F6F4E;">Present '+present+'</b> &nbsp; <b style="color:#A33636;">Absent '+absent+'</b> &nbsp; Total '+total+' &nbsp; ('+pct+'% present)</p>'
    +(abs.length?'<table style="border-collapse:collapse;font-size:14px;"><tr><th align="left" style="padding:6px 10px;">Reg. no.</th><th align="left" style="padding:6px 10px;">Absent student</th></tr>'+absRows+'</table>'+(more>0?'<p>…and '+more+' more.</p>':''):'<p>No absentees.</p>'));
  return {subject:subjectLine, text, html};
}
async function mailAttendanceMarked(marker, subject, date, period, isUpdate){
  const owner=DB.teachers.find(t=>t.id===subject.teacherId) || marker;
  const to=normEmail(owner.email);
  if(!validEmail(to)) return {status:'noemail', to:''};
  if(!MAIL_ON()) return {status:'failed', to};
  const cls=DB.classes.find(c=>c.id===subject.classId);
  const recs=DB.attendance.filter(a=>a.subjectId===subject.id && a.date===date && a.period===period);
  if(!recs.length) return {status:'failed', to};
  try{
    const m=attendanceMarkedMail(owner, marker, subject, cls, date, period, recs, isUpdate);
    await queueMail(uid('att_'),{to,subject:m.subject,text:m.text,html:m.html,kind:'attendance',by:'attendance',teacherId:owner.id},false);
    return {status:'queued', to};
  }catch(e){ return {status:'failed', to}; }
}
const MAIL_UI = {log:[], logMsg:'Loading…', loaded:false};
function decMailDoc(d){
  const f=d.fields||{}, g=k=>f[k]&&('stringValue' in f[k])?f[k].stringValue:'';
  const msg=f.message&&f.message.mapValue?f.message.mapValue.fields||{}:{};
  const del=f.delivery&&f.delivery.mapValue?f.delivery.mapValue.fields||{}:{};
  let to=''; if(f.to){ to=('stringValue' in f.to)?f.to.stringValue:((f.to.arrayValue&&f.to.arrayValue.values)||[]).map(x=>x.stringValue).join(', '); }
  return {to, subject:msg.subject?msg.subject.stringValue:'', by:g('by'), createdAt:f.createdAt?Number(f.createdAt.integerValue):0,
    state:del.state?del.state.stringValue:'', error:del.error&&del.error.stringValue?del.error.stringValue:''};
}
async function loadMailLog(force=false){
  if(MAIL_UI.loaded && !force) return;
  if(!MAIL_ON()){ MAIL_UI.log=[]; MAIL_UI.logMsg='Connect the database in Settings to see sent emails.'; MAIL_UI.loaded=true; return; }
  try{
    const c=getSupabaseCfg();
    const items=await fsPost(c,':runQuery',{structuredQuery:{from:[{collectionId:'mail'}], orderBy:[{field:{fieldPath:'createdAt'},direction:'DESCENDING'}], limit:10}});
    MAIL_UI.log=items.filter(i=>i.document).map(i=>decMailDoc(i.document));
    MAIL_UI.logMsg=MAIL_UI.log.length?'':'No emails yet.';
    MAIL_UI.loaded=true;
  }catch(e){ MAIL_UI.log=[]; MAIL_UI.logMsg='Could not load the email log ('+e.message+'). Publish the updated Firestore rules (Settings) so the "mail" collection is allowed.'; MAIL_UI.loaded=true; }
}
function mailLogHtml(){

}
/* Housekeeping: deletes mails older than 30 days (replaces a Firestore TTL policy, which needs the paid plan).
   Runs from the admin login, at most once a day per browser, in small batches so it costs very few reads. */
async function purgeOldMail(){
  if(!MAIL_ON()) return;
  try{
    if(Date.now()-Number(localStorage.getItem('atl_mail_purge')||0) < 7*86400000) return;
    const c=getSupabaseCfg(), cutoff=Date.now()-30*86400000;
    for(let round=0; round<5; round++){
      const items=await fsPost(c,':runQuery',{structuredQuery:{from:[{collectionId:'mail'}],
        where:{fieldFilter:{field:{fieldPath:'createdAt'},op:'LESS_THAN',value:{integerValue:String(cutoff)}}}, limit:300}});
      const docs=items.filter(i=>i.document);
      if(docs.length) await fsPost(c,':commit',{writes:docs.map(i=>({delete:i.document.name}))});
      if(docs.length<300){ localStorage.setItem('atl_mail_purge',String(Date.now())); return; }   // more left? the next admin login continues
    }
  }catch(e){}
}

function mrClassLines(entries, role){
  return entries.map(tt=>{
    const su=DB.subjects.find(x=>x.id===tt.subjectId), c=DB.classes.find(x=>x.id===tt.classId);
    const what=su?su.name:(tt.text||'Class');
    const tail=role==='teacher' ? clsLabel(c) : (su?teacherName(su):'');
    return 'P'+tt.period+(PERIOD_TIMES[tt.period]?' ('+PERIOD_TIMES[tt.period]+')':'')+' · '+what+(tail?' · '+tail:'');
  });

function mrPeople(ignoreSearch){
  const info=mrInfo(), off=mrOffReason(info), out=[], q=ignoreSearch?'':MR.q.trim().toLowerCase();
  const add=(key,role,name,email,regNo,entries,extra)=>{
    const e=normEmail(email), valid=validEmail(e);
    let dis='';
    if(!valid) dis='no email on file';
    else if(info && !entries.length) dis=off||'no classes';
    if(q && !(name.toLowerCase().includes(q)||e.includes(q)||String(regNo||'').toLowerCase().includes(q))) return;
    out.push({key,role,name,email:e,regNo:regNo||'',entries,dis,extra:extra||''});
  };
  if(MR.who!=='students') DB.teachers.filter(t=>t.status!=='Inactive').forEach(t=>
    add('t:'+t.id,'teacher',t.name,t.email,'',info&&!off?teacherClassesOn(t,info.day):[], 'Teacher'));
  if(MR.who!=='teachers') DB.students.filter(s=>s.status!=='Inactive' && (MR.cls==='all'||s.classId===MR.cls))
    .slice().sort((a,b)=>String(a.regNo).localeCompare(String(b.regNo))).forEach(s=>
    add('s:'+s.id,'student',s.name,s.email,s.regNo,info&&!off?DB.timetable.filter(tt=>tt.classId===s.classId&&tt.day===info.day).sort((a,b)=>a.period-b.period):[],
      'Student · '+s.regNo+' · '+clsLabel(DB.classes.find(c=>c.id===s.classId))));

  $('#mr-del-all').addEventListener('click',()=>{ const ids=rows.map(m=>m.id); if(ids.length && confirm('Delete the entire list shown ('+ids.length+' mails)? This cannot be undone.\n\nTip: use Print list first if you want a copy.')) mrDelete(ids); });
}
async function mrDelete(ids){
  const c=getSupabaseCfg();
  try{
    for(let i=0;i<ids.length;i+=400) await fsPost(c,':commit',{writes:ids.slice(i,i+400).map(id=>({delete:fsRoot(c)+'/mail/'+id}))});
    MR.log=MR.log.filter(m=>!ids.includes(m.id)); ids.forEach(id=>MR.lsel.delete(id));
    showToast('Deleted', ids.length+' mail'+(ids.length>1?'s':'')+' removed from the list.');
  }catch(e){ alert('Could not delete ('+e.message+'). Check the database rules and connection.'); }
  mrRenderListCard();
}
function mrPrint(){
  const rows=mrRows(), label=MR_VIEWS.find(v=>v[0]===MR.view)[1];
  const td='padding:6px;border-bottom:1px solid #ccc;', th='padding:6px;text-align:left;border-bottom:2px solid #000;';
  const st=m=>m.state==='SUCCESS'?'Delivered':m.state==='ERROR'?'Failed':'Queued';
  printReport('<h2 style="margin:0 0 4px;">'+escapeHtml(collegeName())+'</h2><h3 style="margin:0 0 4px;">Mail reminder list — '+escapeHtml(label)+'</h3>'
    +'<p style="margin:0 0 12px;font-size:12px;">Printed '+escapeHtml(new Date().toLocaleString())+' · '+rows.length+' mail'+(rows.length===1?'':'s')+'</p>'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr><th style="'+th+'">#</th><th style="'+th+'">When</th><th style="'+th+'">To</th><th style="'+th+'">Subject</th><th style="'+th+'">Status</th></tr></thead><tbody>'
    +rows.map((m,i)=>'<tr><td style="'+td+'">'+(i+1)+'</td><td style="'+td+'">'+escapeHtml(m.createdAt?new Date(m.createdAt).toLocaleString():'')+'</td><td style="'+td+'">'+escapeHtml(m.to)+'</td><td style="'+td+'">'+escapeHtml(m.subject)+'</td><td style="'+td+'">'+st(m)+'</td></tr>').join('')
    +'</tbody></table>');

async function mrSend(){
  const msg=$('#mr-msg'), btn=$('#mr-send'), err=t=>{ msg.className='form-msg err'; msg.textContent=t; };
  if(!MAIL_ON()) return err('Connect the database in Settings first.');
  const custom=MR.what==='custom';
  if(custom && !MR.sub.trim()) return err('Enter a subject.');
  if(custom && !MR.body.replace(/\{name\}/g,'').trim()) return err('Write a message.');
  const items=mrChosen().map(p=>{ const m=mrMailFor(p); return {to:p.email, subject:m.subject, text:m.text, kind:p.role==='teacher'?'reminder-teachers':'reminder-students'}; });
  mrExtraList().forEach(to=>items.push({to, subject:MR.sub.trim(), text:mrFill(MR.body,{name:'Sir/Madam'}), kind:'reminder-custom'}));
  if(!items.length) return err('Select at least one recipient.');
  if(!confirm('Send this reminder to '+items.length+' recipient'+(items.length>1?'s':'')+'?')) return;
  btn.disabled=true; let ok=0, fail=0;
  for(let i=0;i<items.length;i++){
    msg.className='form-msg'; msg.textContent='Sending '+(i+1)+' of '+items.length+'…';
    try{ await queueMail(uid('rem_'),{to:items[i].to,subject:items[i].subject,text:items[i].text,html:mailWrap(items[i].subject,mrBodyHtml(items[i].text)),kind:items[i].kind,by:'reminder'},false); ok++; }
    catch(e){ fail++; }
  }
  btn.disabled=false;
  await mrLoad(); mrRenderListCard();
  msg.className='form-msg '+(fail?'err':'ok'); msg.textContent=ok+' queued'+(fail?', '+fail+' failed (check database rules).':'. They are delivered within a minute.');
}

    +'<div class="form-row">'+(MR.who!=='teachers'?'<div class="field"><label>Class</label><select id="mr-cls"><option value="all">All classes</option>'+DB.classes.map(c=>'<option value="'+c.id+'" '+(MR.cls===c.id?'selected':'')+'>'+escapeHtml(clsLabel(c))+'</option>').join('')+'</select></div>':'')
    +'<div class="field"><label>Search</label><input id="mr-q" placeholder="Name, reg. no. or email" value="'+escapeHtml(MR.q)+'"/></div></div>'

function renderAdminAccount(){
  const A=adminAccount(), conn=MAIL_ON();
  let html='<div class="page-head"><div><h1>Admin Account</h1><div class="sub">The single administrator login. Sign-in asks for your password and a code e-mailed to the admin address below.</div></div></div>';
  if(!A.email) html+='<div class="card"><p class="form-msg err" style="margin:0;"><b>No admin e-mail is set.</b> Until you add one below, admin sign-in is protected by the password only. Enter your admin e-mail, your current password, and verify it with the code we send.</p></div>';
  if(!conn) html+='<div class="card"><p class="form-msg err" style="margin:0;">Codes are sent by e-mail through the shared database. Connect it in Settings first.</p></div>';
  html+='<div class="card"><h3>Admin details</h3>'
    +'<p class="sub" style="margin:8px 0 12px;">Current admin e-mail: <b>'+(A.email?escapeHtml(A.email):'not set')+'</b>. Changing the e-mail or password needs your current password and a verification code (sent to the new address if the e-mail changes, otherwise to the current one).</p>'
    +'<div class="form-grid">'
    +'<div class="field"><label>Admin e-mail</label><input id="ac-email" type="email" maxlength="254" autocomplete="off" value="'+escapeHtml(A.email)+'"/></div>'
    +'<div class="field"><label>New password <span class="muted">(leave blank to keep)</span></label><input id="ac-new" type="password" autocomplete="new-password" minlength="8"/></div>'
    +'<div class="field"><label>Confirm new password</label><input id="ac-new2" type="password" autocomplete="new-password"/></div>'
    +'<div class="field"><label>Current password</label><input id="ac-cur" type="password" autocomplete="current-password"/></div>'
    +'</div><div class="btn-row"><button class="btn btn-primary" id="ac-save" '+(conn?'':'disabled')+'>Send verification code</button></div>'
    +'<div id="ac-otp" style="display:none;margin-top:14px;"><div class="field" style="max-width:260px;"><label>Enter the 6-digit code sent to <b id="ac-otp-to"></b></label><input id="ac-code" class="otp-input" inputmode="numeric" maxlength="6" placeholder="------"/></div>'
    +'<div class="btn-row"><button class="btn btn-primary" id="ac-confirm">Confirm &amp; save</button><button class="btn btn-ghost" id="ac-resend">Resend code</button><button class="btn btn-ghost" id="ac-cancel">Cancel</button></div></div>'
    +'<div class="form-msg" id="ac-msg" role="alert"></div></div>';
  html+='<div class="card"><div class="mark-toolbar"><h3>Recent emails</h3><button class="btn btn-ghost btn-sm" id="mr-refresh">Refresh</button></div><div id="mr-log">'+mailLogHtml()+'</div></div>';
  html+='<div class="card"><h3>One-time setup: email delivery</h3><p class="sub">This app queues each email (admin login codes and attendance confirmations to teachers) in your Firestore database; Firebase sends it. 1) In Firebase console open <b>Extensions</b> and install <b>Trigger Email from Firestore</b>. 2) Set the collection to <b>mail</b> and enter your SMTP details (for example a Gmail app password or any mail service). 3) In Settings, copy the updated rules (they include <b>mail</b>) into Firestore &gt; Rules and Publish. Until this is done, emails stay "Queued" and admin login codes will not arrive.</p></div>';
  $('#admin-content').innerHTML=html;
  const msg=(t,ok)=>{ const m=$('#ac-msg'); m.textContent=t; m.className='form-msg '+(ok?'ok':'err'); };
  let pending=null;
  const closeOtp=()=>{ otpDrop('acct'); pending=null; $('#ac-otp').style.display='none'; $('#ac-save').style.display=''; };
  $('#ac-save').addEventListener('click', async ()=>{
    if(lockLeft()>0){ msg('Too many wrong attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
    const email=normEmail($('#ac-email').value), np=$('#ac-new').value, np2=$('#ac-new2').value, cur=$('#ac-cur').value;
    if(!validEmail(email)){ msg('Enter a valid admin e-mail address.'); return; }
    if(np && np.length<8){ msg('New password must be at least 8 characters.'); return; }
    if(np && !(/[A-Za-z]/.test(np) && /\d/.test(np))){ msg('New password must contain at least one letter and one number.'); return; }
    if(np!==np2){ msg('The two new passwords do not match.'); return; }
    if(email===A.email && !np){ msg('Nothing to change.'); return; }
    if(!cur || (await hashPw(cur,'admin'))!==A.h){ failLogin(); msg('Current password is incorrect.'); $('#ac-cur').value=''; return; }
    okLogin();
    const dest=(email!==A.email || !A.email) ? email : A.email;
    $('#ac-save').disabled=true; msg('Sending code…',true);
    try{ await otpIssue('acct', dest, 'acct'); }
    catch(e){ msg('Could not send the code ('+e.message+'). Check the database rules and e-mail delivery setup.'); $('#ac-save').disabled=false; return; }
    pending={email, h: np ? await hashPw(np,'admin') : null};
    $('#ac-save').disabled=false; $('#ac-save').style.display='none';
    $('#ac-otp-to').textContent=maskEmail(dest); $('#ac-code').value=''; $('#ac-otp').style.display='block'; $('#ac-code').focus();
    msg('Code sent. It is valid for 5 minutes.',true);
  });
  $('#ac-resend').addEventListener('click', async ()=>{
    if(!pending) return;
    const dest=(pending.email!==A.email || !A.email) ? pending.email : A.email;
    try{ await otpIssue('acct', dest, 'acct'); msg('A new code was sent.',true); }catch(e){ msg('Could not resend ('+e.message+').'); }
  });
  $('#ac-cancel').addEventListener('click', ()=>{ closeOtp(); msg(''); });
  $('#ac-confirm').addEventListener('click', async ()=>{
    if(!pending) return;
    if(lockLeft()>0){ msg('Too many wrong attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
    const r=await otpCheck('acct', $('#ac-code').value);
    if(r.s==='expired'){ closeOtp(); msg('That code has expired. Start again.'); return; }
    if(r.s==='locked'){ failLogin(); closeOtp(); msg('Too many wrong codes. Start again.'); return; }
    if(r.s==='bad'){ failLogin(); msg('Incorrect code. '+r.left+' attempt'+(r.left===1?'':'s')+' left.'); $('#ac-code').value=''; return; }
    const oldEmail=A.email, changedPw=!!pending.h, changedEmail=pending.email!==A.email;
    setSetting('adminAcct',{user:A.user, email:pending.email, h:pending.h||A.h});
    if(oldEmail && validEmail(oldEmail)){      // security notice to the previous address
      const what=[changedEmail?'the admin e-mail':'', changedPw?'the admin password':''].filter(Boolean).join(' and ');
      queueMail(uid('sec_'),{to:oldEmail,subject:'Admin details changed',text:'Hello,\n\n'+what+' for the admin portal was just changed. If this was not you, act immediately.\n\n'+collegeName(),
        html:mailWrap('Admin details changed','<p>'+escapeHtml(what)+' for the admin portal was just changed.</p><p>If this was not you, act immediately.</p>'),kind:'security',by:'system'},false).catch(()=>{});
    }
    pending=null; renderAdminAccount(); const m=$('#ac-msg'); m.textContent='Admin details updated.'; m.className='form-msg ok';
  });
  $('#mr-refresh').addEventListener('click', async()=>{ await loadMailLog(true); const el=$('#mr-log'); if(el) el.innerHTML=mailLogHtml(); });
  if(!MAIL_UI.loaded) loadMailLog().then(()=>{ const el=$('#mr-log'); if(el) el.innerHTML=mailLogHtml(); });
}
function initApp(){

  document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveSnap(true); else if(Date.now()-LAST_POLL>120000) pollRev(); });

  if(BACKEND_ON()) schedulePoll();
}

(function(){

  });
  /* install as an app (Chrome / Edge / Android) */
  let dip=null; const btns=()=>Array.prototype.slice.call(document.querySelectorAll('.install-btn'));
  const standalone=()=> (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); dip=e; if(!standalone()) btns().forEach(b=>b.style.display=''); });
  window.addEventListener('appinstalled',()=>{ dip=null; btns().forEach(b=>b.style.display='none'); });
  btns().forEach(b=>b.addEventListener('click',async()=>{ if(!dip) return; dip.prompt(); try{ await dip.userChoice; }catch(e){} dip=null; btns().forEach(x=>x.style.display='none'); }));
  if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone()){ const h=document.getElementById('ios-hint'); if(h) h.style.display=''; }
})();
